[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "outer-harness"
version = "1.0.0"
description = "An outer harness for coding agents: judge at the turn boundary, gate production through source control, close the loop on signals"
requires-python = ">=3.11"
# Standard library only, deliberately. This installs into a slim Cloud Run
# image with no build step and no platform constraints - which is also why
# the Cursor transport is REST rather than the Python SDK, since the SDK is
# a client for a locally launched CLI bridge.
dependencies = []

[project.scripts]
harness = "harness.cli:main"
history = "harness.history:main"
agent-tick = "reconciler.tick:main"

[tool.setuptools]
packages = ["loop", "harness", "harness.oracle_kit", "harness.scorecard", "roles", "reconciler", "cloud", "dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

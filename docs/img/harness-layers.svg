<svg xmlns="http://www.w3.org/2000/svg" width="680" height="462" viewBox="0 0 680 462" role="img">
<title>The layers of an agent harness</title>
<desc>Five nested layers. Model weights, inference and the agent loop sit at the core. The agent harness — the CLI around the model loop — surrounds them and lives inside the workspace the agent can edit. The system layer sits outside the workspace entirely.</desc>
<style>
  .t  { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .th { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .ts { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
</style>

<rect x="0" y="0" width="680" height="462" fill="#ffffff"/>

<!-- Layer 4: the system layer -->
<rect x="40" y="40" width="600" height="312" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text class="th" x="60" y="66" fill="#04342C">System layer</text>
<text class="ts" x="620" y="66" text-anchor="end" fill="#0F6E56">The agent never clones this</text>
<text class="ts" x="60" y="82" fill="#0F6E56">Spawn, wait, read the whole session, classify, merge or escalate</text>

<!-- Layer 3: the agent harness -->
<rect x="86" y="88" width="508" height="248" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
<text class="th" x="106" y="114" fill="#412402">Agent harness</text>
<text class="ts" x="574" y="114" text-anchor="end" fill="#854F0B">The agent can edit this</text>
<text class="ts" x="106" y="130" fill="#854F0B">The CLI around the model loop — slash commands, hooks, MCP, tools</text>

<!-- Layer 2: the agent loop -->
<rect x="132" y="136" width="416" height="184" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text class="th" x="152" y="162" fill="#2C2C2A">Agent loop</text>
<text class="ts" x="152" y="178" fill="#5F5E5A">Context assembly, tool dispatch, compaction, retry</text>

<!-- Layer 1: inference -->
<rect x="178" y="184" width="324" height="120" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text class="th" x="198" y="210" fill="#2C2C2A">Inference</text>
<text class="ts" x="198" y="226" fill="#5F5E5A">Sampling, context window, tool schema</text>

<!-- Layer 0: weights -->
<rect x="224" y="232" width="232" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text class="th" x="244" y="256" fill="#2C2C2A">Model weights</text>
<text class="ts" x="244" y="272" fill="#5F5E5A">Fixed before the run starts</text>

<!-- The point -->
<rect x="40" y="374" width="600" height="60" rx="4" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 4"/>
<text class="t" x="60" y="399" fill="#2C2C2A">Every inner layer sees one tool call, or one turn, from inside the workspace.</text>
<text class="t" x="60" y="419" fill="#2C2C2A">The outer layer sees the whole session, from outside it.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img">
<title>Two loops, one gate</title>
<desc>Left loop: production runs, review agents raise data quality issues, Master (DQ) wakes on a deterministic rule and fixes the cause, and its branch passes the gate and rebuilds production. Right loop: the gate's RED verdicts, open tasks and crashes become signals, Master (Agents) proposes a change to the zone map or weights, and a replay oracle re-classifies every stored branch before the gate itself changes.</desc>
<defs>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"/></marker>
  <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3B6D11"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A32D2D"/></marker>
</defs>
<style>
  .t  { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .th { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .tb { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .ts { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .tl { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
</style>

<rect x="0" y="0" width="900" height="500" fill="#ffffff"/>
<text class="th" x="30" y="32" fill="#2C2C2A">Two loops share one gate. The left improves the product. The right improves the gate.</text>

<!-- loop titles -->
<text class="tb" x="270" y="232" text-anchor="middle" fill="#2C2C2A">Loop 1 · the product</text>
<text class="ts" x="270" y="252" text-anchor="middle" fill="#5F5E5A">is the output right?</text>
<text class="tb" x="630" y="232" text-anchor="middle" fill="#2C2C2A">Loop 2 · the gate</text>
<text class="ts" x="630" y="252" text-anchor="middle" fill="#5F5E5A">is the judge right?</text>

<!-- gate -->
<rect x="375" y="200" width="150" height="80" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.25"/>
<text class="th" x="450" y="232" text-anchor="middle" fill="#04342C">Merge gate</text>
<text class="ts" x="450" y="252" text-anchor="middle" fill="#0F6E56">classifier + zone map</text>

<!-- left loop -->
<rect x="185" y="56" width="170" height="70" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text class="th" x="201" y="80" fill="#2C2C2A">Production run</text>
<text class="ts" x="201" y="99" fill="#5F5E5A">on its schedule</text>
<text class="ts" x="201" y="115" fill="#5F5E5A">review agents read output</text>

<rect x="20" y="205" width="150" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
<text class="th" x="36" y="229" fill="#042C53">DQ issues</text>
<text class="ts" x="36" y="248" fill="#185FA5">fingerprinted, ranked</text>
<text class="ts" x="36" y="264" fill="#185FA5">by severity × recurrence</text>

<rect x="185" y="354" width="170" height="70" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
<text class="th" x="201" y="378" fill="#412402">Master (DQ)</text>
<text class="ts" x="201" y="397" fill="#854F0B">wakes on issue pressure</text>
<text class="ts" x="201" y="413" fill="#854F0B">fixes the cause, or holds</text>

<line x1="200" y1="128" x2="128" y2="202" stroke="#5F5E5A" stroke-width="1.25" marker-end="url(#ag)"/>
<text class="tl" x="96" y="160" fill="#5F5E5A">raises</text>
<line x1="128" y1="278" x2="200" y2="351" stroke="#5F5E5A" stroke-width="1.25" marker-end="url(#ag)"/>
<text class="tl" x="96" y="326" fill="#5F5E5A">wakes</text>
<line x1="357" y1="370" x2="410" y2="283" stroke="#5F5E5A" stroke-width="1.25" marker-end="url(#ag)"/>
<text class="tl" x="392" y="342" fill="#5F5E5A">branch</text>
<line x1="410" y1="197" x2="357" y2="110" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#agr)"/>
<text class="tl" x="372" y="150" text-anchor="end" fill="#3B6D11">merge =</text>
<text class="tl" x="372" y="165" text-anchor="end" fill="#3B6D11">deploy</text>

<!-- right loop -->
<rect x="545" y="56" width="170" height="70" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.75"/>
<text class="th" x="561" y="80" fill="#501313">Agent signals</text>
<text class="ts" x="561" y="99" fill="#A32D2D">scored REDs, open tasks,</text>
<text class="ts" x="561" y="115" fill="#A32D2D">crashed runs</text>

<rect x="730" y="205" width="150" height="70" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
<text class="th" x="746" y="229" fill="#412402">Master (Agents)</text>
<text class="ts" x="746" y="248" fill="#854F0B">reads the stored diffs</text>
<text class="ts" x="746" y="264" fill="#854F0B">retunes zones, weights</text>

<rect x="545" y="354" width="170" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text class="th" x="561" y="378" fill="#04342C">Replay oracle</text>
<text class="ts" x="561" y="397" fill="#0F6E56">re-judges every past branch</text>
<text class="ts" x="561" y="413" fill="#0F6E56">frozen REDs must stay RED</text>

<line x1="490" y1="197" x2="543" y2="110" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text class="tl" x="530" y="164" fill="#A32D2D">RED</text>
<line x1="700" y1="128" x2="772" y2="202" stroke="#5F5E5A" stroke-width="1.25" marker-end="url(#ag)"/>
<text class="tl" x="756" y="160" fill="#5F5E5A">wakes</text>
<line x1="772" y1="278" x2="700" y2="351" stroke="#5F5E5A" stroke-width="1.25" marker-end="url(#ag)"/>
<text class="tl" x="756" y="326" fill="#5F5E5A">proposes</text>
<line x1="543" y1="370" x2="490" y2="283" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#agr)"/>
<text class="tl" x="530" y="318" fill="#3B6D11">pass</text>

<rect x="30" y="448" width="840" height="36" rx="4" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 4"/>
<text class="t" x="50" y="471" fill="#2C2C2A">Every agent, masters included, is judged by the same gate. Master (Agents) can retune it, never the code that judges the retuning.</text>
</svg>
